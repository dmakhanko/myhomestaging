name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Vercel deploy
        run: sleep 90

      - name: Run smoke
        run: bash scripts/smoke.sh https://myhomestaging.ru
